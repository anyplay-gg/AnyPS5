name: Sync with upstream

# Keeps one open pull request that merges boykopovar/AnyPS5 main into this fork. The branch is
# sync/upstream-<date>, cut from main, and the merge is a merge commit. The job runs weekly and on
# demand. Nothing here merges the pull request: a person reads it, the builds run on it, and then it
# is merged (docs/dev/FORK.md lists what the fork changes and why).
#
# - Clean merge: the branch is pushed, the pull request is opened or refreshed, and the Linux build
#   (GitHub's hosted runner) and the Windows build are dispatched for it. A pull request opened with
#   the workflow token starts no pull_request workflows, so this job starts the build itself.
# - Conflict: the pull request is opened as a draft. The branch holds the merge with the conflict
#   markers committed, and the pull request lists the conflicting files. No build is started.
# - A branch that a person has pushed to is never rewritten: later runs merge on top of it, and
#   only report when that conflicts.
# - After the merge the job checks that docs/dev/FORK.md still describes every place the fork
#   differs from upstream, and fails when it does not.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      build:
        description: Start the Linux and Windows builds for the pull request
        required: false
        default: true
        type: boolean
      hosted:
        description: Run the Linux build on GitHub's hosted runner
        required: false
        default: true
        type: boolean
      base:
        description: Branch to merge upstream into and to open the pull request against
        required: false
        default: main
        type: string
      prefix:
        description: Branch name prefix of the sync branch, the date is appended
        required: false
        default: sync/upstream
        type: string

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'anyplaynet/AnyPS5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ inputs.base || 'main' }}
      PREFIX: ${{ inputs.prefix || 'sync/upstream' }}
      BUILD: ${{ github.event_name == 'schedule' && 'true' || format('{0}', inputs.build) }}
      HOSTED: ${{ github.event_name == 'schedule' && 'true' || format('{0}', inputs.hosted) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch upstream and copy the tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/boykopovar/AnyPS5.git
          git fetch --no-tags upstream main
          mkdir -p "$RUNNER_TEMP/tools"
          cp tools/check_main_sync.py tools/fork_divergence.py tools/sync_upstream.py "$RUNNER_TEMP/tools/"
      - name: Find the open sync pull request
        id: find
        run: |
          gh pr list --state open --base "$BASE" --json number,headRefName,isDraft,isCrossRepository > "$RUNNER_TEMP/prs.json"
          jq --arg prefix "$PREFIX" '[.[] | select(.isCrossRepository == false and (.headRefName | startswith($prefix)))][0] // {}' "$RUNNER_TEMP/prs.json" > "$RUNNER_TEMP/found.json"
          echo "branch=$(jq -r '.headRefName // empty' "$RUNNER_TEMP/found.json")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.isDraft // false' "$RUNNER_TEMP/found.json")" >> "$GITHUB_OUTPUT"
      - name: Merge upstream into the sync branch
        id: merge
        env:
          EXISTING: ${{ steps.find.outputs.branch }}
        run: |
          python3 "$RUNNER_TEMP/tools/sync_upstream.py" --main "origin/$BASE" --prefix "$PREFIX" --date "$(date -u +%F)" --existing "$EXISTING" --out "$RUNNER_TEMP/sync"
          for key in status branch push force old title draft sha; do
            echo "$key=$(jq -r ".$key" "$RUNNER_TEMP/sync/state.json")" >> "$GITHUB_OUTPUT"
          done
          cat "$RUNNER_TEMP/sync/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the sync branch
        if: steps.merge.outputs.push == 'true'
        env:
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
          FORCE: ${{ steps.merge.outputs.force }}
          OLD: ${{ steps.merge.outputs.old }}
        run: |
          push() {
            if [ "$FORCE" = "true" ]; then
              git push --force-with-lease="$SYNC_BRANCH:$OLD" origin "$SYNC_BRANCH"
            else
              git push origin "$SYNC_BRANCH"
            fi
          }
          if push 2> "$RUNNER_TEMP/push.err"; then exit 0; fi
          cat "$RUNNER_TEMP/push.err"
          if ! grep -q 'without `workflows` permission' "$RUNNER_TEMP/push.err"; then exit 1; fi
          echo "::warning::upstream changed workflow files, which the workflow token cannot push; the branch keeps the fork's version of them"
          python3 "$RUNNER_TEMP/tools/sync_upstream.py" --strip-workflows --main "origin/$BASE" --date "$(date -u +%F)" --out "$RUNNER_TEMP/sync"
          push
      - name: Open or update the pull request
        id: pr
        if: steps.merge.outputs.status != 'none'
        env:
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
          TITLE: ${{ steps.merge.outputs.title }}
          DRAFT: ${{ steps.merge.outputs.draft }}
          WAS_DRAFT: ${{ steps.find.outputs.draft }}
        run: |
          number=$(gh pr list --state open --head "$SYNC_BRANCH" --base "$BASE" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            if ! number=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f head="$SYNC_BRANCH" -f base="$BASE" -f title="$TITLE" -F body=@"$RUNNER_TEMP/sync/body.md" -F draft="$DRAFT" --jq .number); then
              {
                echo "The branch $SYNC_BRANCH is pushed, but this workflow could not open the pull request. Open it here: https://github.com/$GITHUB_REPOSITORY/compare/$BASE...$SYNC_BRANCH?expand=1"
                echo
                echo "The organisation setting Actions > General > Allow GitHub Actions to create and approve pull requests lets this job open it itself."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::could not open the pull request, see the job summary"
              exit 1
            fi
          else
            gh pr edit "$number" --title "$TITLE" --body-file "$RUNNER_TEMP/sync/body.md"
            if [ "$DRAFT" = "true" ] && [ "$WAS_DRAFT" != "true" ]; then gh pr ready "$number" --undo; fi
            if [ "$DRAFT" != "true" ] && [ "$WAS_DRAFT" = "true" ]; then gh pr ready "$number"; fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Pull request: https://github.com/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the builds
        if: steps.merge.outputs.status == 'clean' && steps.merge.outputs.push == 'true' && steps.pr.outputs.number != '' && env.BUILD == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh workflow run build.yml --ref "$BASE" -f pr="$PR_NUMBER" -f hosted="$HOSTED"
      - name: Check the fork divergence table
        if: steps.merge.outputs.status == 'clean'
        shell: bash
        env:
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
        run: python3 "$RUNNER_TEMP/tools/fork_divergence.py" --upstream upstream/main --head "$SYNC_BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
